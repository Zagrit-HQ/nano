name: "Secrets v2: Combo (branch + environment)"

on:
  workflow_dispatch:

jobs:
  main-production:
    runs-on: depot-ubuntu-22.04
    environment: production
    steps:
      - name: Print secrets context
        env:
          COMBO_SECRET: ${{ secrets.COMBO_SECRET }}
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          echo "=== Secrets v2: main + production ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: $GITHUB_ENVIRONMENT"
          echo ""
          echo "COMBO_SECRET length: ${#COMBO_SECRET}"
          if [ -z "$COMBO_SECRET" ]; then
            echo "❌ COMBO_SECRET is empty"
          else
            echo "✅ COMBO_SECRET is set (masked)"
          fi
          echo ""
          echo "TEST_SECRET length: ${#TEST_SECRET}"

  main-staging:
    runs-on: depot-ubuntu-22.04
    environment: staging
    steps:
      - name: Print secrets context
        env:
          COMBO_SECRET: ${{ secrets.COMBO_SECRET }}
        run: |
          echo "=== Secrets v2: main + staging ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: $GITHUB_ENVIRONMENT"
          echo ""
          echo "COMBO_SECRET length: ${#COMBO_SECRET}"
          if [ -z "$COMBO_SECRET" ]; then
            echo "ℹ️  COMBO_SECRET is empty (expected on main+staging — no matching combo rule)"
          else
            echo "✅ COMBO_SECRET is set"
          fi

  no-env:
    runs-on: depot-ubuntu-22.04
    steps:
      - name: Print secrets context
        env:
          COMBO_SECRET: ${{ secrets.COMBO_SECRET }}
        run: |
          echo "=== Secrets v2: main + no environment ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo ""
          echo "COMBO_SECRET length: ${#COMBO_SECRET}"
          if [ -z "$COMBO_SECRET" ]; then
            echo "ℹ️  COMBO_SECRET is empty (expected — combo rules need environment)"
          else
            echo "⚠️  COMBO_SECRET is set — should be empty without environment"
          fi
