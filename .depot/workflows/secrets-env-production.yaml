name: "Secrets v2: Environment production"

on:
  workflow_dispatch:

jobs:
  verify-with-env:
    runs-on: depot-ubuntu-22.04
    environment: production
    steps:
      - name: Print secrets context
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
          COMBO_SECRET: ${{ secrets.COMBO_SECRET }}
          TEST_VAR: ${{ vars.TEST_VAR }}
        run: |
          echo "=== Secrets v2: Environment production test ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: $GITHUB_ENVIRONMENT"
          echo ""
          echo "TEST_SECRET length: ${#TEST_SECRET}"
          if [ -z "$TEST_SECRET" ]; then
            echo "❌ TEST_SECRET is empty"
          else
            echo "✅ TEST_SECRET is set (masked)"
          fi
          echo ""
          echo "COMBO_SECRET length: ${#COMBO_SECRET}"
          if [ -z "$COMBO_SECRET" ]; then
            echo "❌ COMBO_SECRET is empty"
          else
            echo "✅ COMBO_SECRET is set (masked)"
          fi
          echo ""
          echo "TEST_VAR value: '$TEST_VAR'"

  verify-without-env:
    runs-on: depot-ubuntu-22.04
    steps:
      - name: Print secrets context (no environment)
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
          COMBO_SECRET: ${{ secrets.COMBO_SECRET }}
          TEST_VAR: ${{ vars.TEST_VAR }}
        run: |
          echo "=== Secrets v2: No environment (control) ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: $GITHUB_ENVIRONMENT"
          echo ""
          echo "TEST_SECRET length: ${#TEST_SECRET}"
          echo "COMBO_SECRET length: ${#COMBO_SECRET}"
          echo "TEST_VAR value: '$TEST_VAR'"
