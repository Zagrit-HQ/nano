on:
  workflow_dispatch:

jobs:
  large-snapshot:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Create large layer
        run: |
          # Write a 100 MB file to produce a large snapshot layer
          dd if=/dev/urandom of=/large-layer.bin bs=1M count=100 status=progress

      - uses: depot/snapshot-action@v1
        with:
          image: d58mfwccbf.preview.registry.depot.dev/large-snapshot:latest
