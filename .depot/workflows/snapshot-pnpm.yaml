on:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: depot-ubuntu-latest
    steps:
      #      - name: Checkout repository
      #        uses: actions/checkout@v6
      #        with:
      #          fetch-depth: 1

      - name: Checkout repository (sparse)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ./package.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Prime dependency store with dev deps
        run: pnpm install --dev --frozen-lockfile

      - name: Restore full git state
        run: |
          BRANCH=$(git symbolic-ref --short HEAD)
          ORIGIN=$(git remote get-url origin)
          rm -rf .git
          git init
          git remote add origin "$ORIGIN"
          git fetch --depth=1 origin "$BRANCH"
          git reset --hard FETCH_HEAD

      - name: Snapshot CI image
        uses: depot/snapshot-action@v1
        with:
          image: d58mfwccbf.registry.depot.dev/nano-base:latest
