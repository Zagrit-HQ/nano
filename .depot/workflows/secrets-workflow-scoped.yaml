name: "Secrets v2: Workflow-scoped"

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: depot-ubuntu-22.04
    steps:
      - name: Print secrets context
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
          TEST_VAR: ${{ vars.TEST_VAR }}
        run: |
          echo "=== Secrets v2: Workflow-scoped test ==="
          echo "Workflow: secrets-workflow-scoped.yaml"
          echo "Branch: $GITHUB_REF_NAME"
          echo ""
          echo "TEST_SECRET length: ${#TEST_SECRET}"
          if [ -z "$TEST_SECRET" ]; then
            echo "❌ TEST_SECRET is empty"
          else
            echo "✅ TEST_SECRET is set (masked)"
          fi
          echo ""
          echo "TEST_VAR value: '$TEST_VAR'"
