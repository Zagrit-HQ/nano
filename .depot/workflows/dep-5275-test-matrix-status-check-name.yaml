# .github/workflows/matrix-status-check.yml
name: Matrix status check

on:
  pull_request:

jobs:
  schema:
    # Explicit, simplified status-check name.
    name: schema-${{ matrix.customer }}-${{ matrix.database }}

    strategy:
      fail-fast: false
      matrix:
        customer: [main, enterprise]
        database: [mysql, postgres]
        environment: [dev, production]

    runs-on: ubuntu-latest

    steps:
      - name: Display combination
        run: |
          echo "customer=${{ matrix.customer }}"
          echo "database=${{ matrix.database }}"
          echo "environment=${{ matrix.environment }}"